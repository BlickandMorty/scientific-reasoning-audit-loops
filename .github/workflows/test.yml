name: test-and-verify

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install pytest
      - run: pytest -q
      - run: python verify_claims.py
      - run: python generate_balanced_confirmation.py
      - run: git diff --exit-code data/science_cases_balanced_confirmation_v1.json data/science_cases_balanced_confirmation_manifest_v1.json
      - run: python verify_balanced_confirmation.py
